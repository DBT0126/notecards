<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3x5 Notecard Maker</title>

<style>
  :root { --bg:#f4f4f4; --panel:#fff; --border:#ccc; --accent:#2b6cb0; --text:#222; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:12px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; min-width:0; }
  .panel h2 { margin:0 0 10px; font-size:15px; text-transform:uppercase; letter-spacing:.5px; color:#555; }
  textarea { width:100%; height:200px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; padding:10px; border:1px solid var(--border); border-radius:6px; resize:vertical; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0; font-size:13px; }
  .controls label { display:flex; align-items:center; gap:5px; }
  input[type="text"], input[type="number"], select { padding:5px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; }
  input[type="number"] { width:70px; }
  button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:13px; cursor:pointer; }
  button:hover { background:#22548a; }
  button.secondary { background:#666; } button.secondary:hover { background:#4d4d4d; }
  button.tertiary { background:#2f855a; } button.tertiary:hover { background:#276749; }
  button.warn { background:#b7791f; } button.warn:hover { background:#975a16; }
  button.study { background:#6b46c1; } button.study:hover { background:#553c9a; }
  button.small { padding:5px 10px; font-size:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { background:#e2e8f0; color:#333; }
  .tabs button:hover { background:#cbd5e0; }
  .tabs button.active, .tabs button.active:hover { background:var(--accent); color:#fff; }
  .card-count { font-size:13px; color:#666; margin-top:4px; }
  #warnings { font-size:13px; color:#c53030; margin-top:4px; }
  fieldset { border:1px solid var(--border); border-radius:6px; padding:6px 10px 8px; margin:8px 0; font-size:13px; }
  legend { font-weight:600; padding:0 4px; color:#555; }
  .hint { font-size:11px; color:#888; }
  .session-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  #sessionStatus { font-size:12px; color:#2f855a; min-height:16px; }
  #sessionStatus.error { color:#c53030; }

  #cardGrid { display:flex; flex-wrap:wrap; gap:10px; max-height:700px; overflow-y:auto; padding:4px; }
